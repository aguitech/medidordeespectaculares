[project]
name = "medidordeespectaculares"
version = "1.0.0"
description = "KYC + Biometría Facial + ML Risk Scoring — originación crediticia automatizada"
requires-python = ">=3.11"
authors = [
    {name = "AGUITECH", email = "hector@aguitech.com"},
]
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "alembic==1.14.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "python-multipart==0.0.20",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "numpy==2.2.0",
    "scikit-learn==1.6.0",
    "scipy==1.14.1",
    "Pillow==11.0.0",
    "opencv-python-headless==4.10.0.84",
    "httpx==0.28.1",
    "redis==5.2.1",
    "structlog==24.4.0",
    "tenacity==9.0.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-asyncio==0.24.0", "httpx==0.28.1", "black==24.10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
